            };

            const showAlert = (message) => setDialog({ isOpen: true, message, type: 'alert', onConfirm: null });
            const showConfirm = (message, onConfirm) => setDialog({ isOpen: true, message, type: 'confirm', onConfirm });
            const nextBadge = BADGES.find(b => !earnedBadgeIds.includes(b.id)) || null;

            const startQuiz = (questions, title, startIdx = 0, color = 'slate') => {
                const qWithShuffledOptions = questions.map(q => {
                    const indices = q.o.map((_, i) => i).sort(() => 0.5 - Math.random());
                    return { ...q, shuffledIndices: indices };
                });
                setActiveQuiz(qWithShuffledOptions);
                setQuizTitle(title);
                setActiveColorTheme(color);
                setCurrentQIndex(startIdx);
                setShowExplanation(false);
                setView('quiz');
            };

            const startSubtopic = (mainIdx, subIdx) => {
                const topic = topicsData[mainIdx];
                let qs = flatQuestions.filter(fq => fq.main === topic.main && fq.t === topic.subtopics[subIdx].t);
                let unsolvedQs = qs.filter(q => globalAnswers[q.id] === undefined);
                if (unsolvedQs.length === 0) {
                    showAlert("You have solved all questions in this subtopic!");
                    return;
                }
                unsolvedQs = [...unsolvedQs].sort(() => 0.5 - Math.random());
                setIsResolveSession(false);
                setIsMarkedSession(false);
                startQuiz(unsolvedQs, `${topic.main}: ${topic.subtopics[subIdx].t}`, 0, topic.color);
            };

            const startRandomMaster = () => {
                const unsolvedQs = flatQuestions.filter(q => globalAnswers[q.id] === undefined);
                if(unsolvedQs.length === 0) {
                    showAlert("You have solved all questions! Reset the quiz if you want to start over.");
                    return;
                }
                const shuffled = [...unsolvedQs].sort(() => 0.5 - Math.random());
                setIsResolveSession(false);
                setIsMarkedSession(false);
                startQuiz(shuffled, "Random Master Quiz", 0, 'slate');
            };

            const startTopicRandomMaster = (mainIdx) => {
                const topic = topicsData[mainIdx];
                const unsolvedQs = flatQuestions.filter(q => q.main === topic.main && globalAnswers[q.id] === undefined);
                if(unsolvedQs.length === 0) {
                    showAlert("You have solved all questions in this topic!");
                    return;
                }
                const shuffled = [...unsolvedQs].sort(() => 0.5 - Math.random());
                setIsResolveSession(false);
                setIsMarkedSession(false);
                startQuiz(shuffled, `${topic.main}: Random Master`, 0, topic.color);
            };

            const reviewSolvedQuestions = () => {
                const solvedQs = flatQuestions.filter(q => globalAnswers[q.id] !== undefined);
                if(solvedQs.length === 0) {
                    showAlert("You haven't solved any questions yet!");
                    return;
                }
                setIsResolveSession(false);
                setIsMarkedSession(false);
                startQuiz(solvedQs, "Review: Solved History", 0, 'slate');
            };

            const reviewMainTopic = (mainIdx) => {
                const topic = topicsData[mainIdx];
                const solvedQs = flatQuestions.filter(q => q.main === topic.main && globalAnswers[q.id] !== undefined);
                if(solvedQs.length === 0) {
                    showAlert("You haven't solved any questions in this topic yet!");
                    return;
                }
                setIsResolveSession(false);
                setIsMarkedSession(false);
                startQuiz(solvedQs, `Review: ${topic.main}`, 0, topic.color);
            };

            const resolveReviewQuestions = () => {
                if (hardOrWrongIds.length === 0) return;
                const reviewQs = flatQuestions.filter(q => hardOrWrongIds.includes(q.id)).sort(() => 0.5 - Math.random());
                setIsResolveSession(true);
                setIsMarkedSession(false);
                setSessionAnswers({});
                startQuiz(reviewQs, "Review: Hard & Incorrect Questions", 0, 'slate');
            };

            const resolveMainTopic = (mainIdx) => {
                const topic = topicsData[mainIdx];
                const hwIds = Array.from(new Set([...wrongIds, ...hardIds]));
                const reviewQs = flatQuestions.filter(q => q.main === topic.main && hwIds.includes(q.id)).sort(() => 0.5 - Math.random());
                if (reviewQs.length === 0) {
                    showAlert("No hard or wrong questions to review in this topic!");
                    return;
                }
                setIsResolveSession(true);
                setIsMarkedSession(false);
                setSessionAnswers({});
                startQuiz(reviewQs, `Re-solve: ${topic.main} (Hard/Wrong)`, 0, topic.color);
            };

            const reviewMarkedQuestions = () => {
                if (markedIds.length === 0) return;
                const mQs = flatQuestions.filter(q => markedIds.includes(q.id)).sort(() => 0.5 - Math.random());
                setIsMarkedSession(true);
                setIsResolveSession(false);
                setSessionAnswers({});
                startQuiz(mQs, "Review: Marked Questions", 0, 'slate');
            };

            const resetAll = () => {
                showConfirm("Are you sure you want to reset EVERYTHING? This clears all progress, badges, and saves.", () => {
                    setGlobalAnswers({});
                    setHardIds([]);
                    setMarkedIds([]);
                    setEarnedBadgeIds([]);
                    localStorage.clear();
                    localStorage.setItem('hasVisitedSubSurgery', 'true');
                });
            };

            const resetMainTopic = (e, mainIdx) => {
                e.stopPropagation();
                const topic = topicsData[mainIdx];
                showConfirm(`Are you sure you want to reset all progress for ${topic.main}?`, () => {
                    const idsToReset = flatQuestions.filter(q => q.main === topic.main).map(q => q.id);
                    setGlobalAnswers(prev => {
                        const newAnswers = { ...prev };
                        idsToReset.forEach(id => delete newAnswers[id]);
                        return newAnswers;
                    });
                    setHardIds(prev => prev.filter(id => !idsToReset.includes(id)));
                    setMarkedIds(prev => prev.filter(id => !idsToReset.includes(id)));
                });
            };

            const resetSubtopic = (e, mainIdx, subIdx) => {
                e.stopPropagation();
                const topic = topicsData[mainIdx];
                const sub = topic.subtopics[subIdx];
                showConfirm(`Are you sure you want to reset ${sub.t}?`, () => {
                    const idsToReset = flatQuestions.filter(q => q.main === topic.main && q.t === sub.t).map(q => q.id);
                    setGlobalAnswers(prev => {
                        const newAnswers = { ...prev };
                        idsToReset.forEach(id => delete newAnswers[id]);
                        return newAnswers;
                    });
                    setHardIds(prev => prev.filter(id => !idsToReset.includes(id)));
                    setMarkedIds(prev => prev.filter(id => !idsToReset.includes(id)));
                });
            };

            const reviewSubtopic = (e, mainIdx, subIdx) => {
                e.stopPropagation();
                const topic = topicsData[mainIdx];
                const sub = topic.subtopics[subIdx];
                const solvedQs = flatQuestions.filter(q => q.main === topic.main && q.t === sub.t && globalAnswers[q.id] !== undefined);
                if(solvedQs.length === 0) {
                    showAlert("You haven't solved any questions in this subtopic yet!");
                    return;
                }
                setIsResolveSession(false);
                setIsMarkedSession(false);
                startQuiz(solvedQs, `Review: ${sub.t}`, 0, topic.color);
            };

            const handleOptionClick = (origIdx) => {
                const currentQ = activeQuiz[currentQIndex];
                
                if (isMarkedSession) {
                    if (sessionAnswers[currentQ.id] !== undefined) return;
                    setSessionAnswers(prev => ({ ...prev, [currentQ.id]: origIdx }));
                    return;
                }

                if (isResolveSession) {
                    if (sessionAnswers[currentQ.id] !== undefined) return;
                    setSessionAnswers(prev => ({ ...prev, [currentQ.id]: origIdx }));
                    setGlobalAnswers(prev => ({ ...prev, [currentQ.id]: origIdx }));
                    if (hardIds.includes(currentQ.id)) setHardIds(prev => prev.filter(id => id !== currentQ.id));
                    return;
                }
                
                if (globalAnswers[currentQ.id] !== undefined) return;
                setGlobalAnswers(prev => ({ ...prev, [currentQ.id]: origIdx }));
                if (hardIds.includes(currentQ.id)) setHardIds(prev => prev.filter(id => id !== currentQ.id));
            };

            const toggleHard = () => {
                const qId = activeQuiz[currentQIndex].id;
                if (hardIds.includes(qId)) setHardIds(prev => prev.filter(id => id !== qId));
                else setHardIds(prev => [...prev, qId]);
            };

            const toggleMark = (e) => {
                const qId = activeQuiz[currentQIndex].id;
                if (markedIds.includes(qId)) setMarkedIds(prev => prev.filter(id => id !== qId));
                else setMarkedIds(prev => [...prev, qId]);
            };

            const askChatGPTPerQuestion = () => {
                const q = activeQuiz[currentQIndex];
                const optionsText = q.o.map((opt, i) => `${String.fromCharCode(65+i)}. ${opt}`).join('\n');
                const prompt = `Question: ${q.q}\n\nOptions:\n${optionsText}\n\nExplain this question in detail, including why the correct answer is correct and why the other options are wrong. At the end, write a high-yield summary note to remember.`;
                window.open(`https://chatgpt.com/?q=${encodeURIComponent(prompt)}`, '_blank');
            };

            const generateTutorialWithChatGPT = (targetQs = null) => {
                const reviewQs = targetQs || flatQuestions.filter(q => hardOrWrongIds.includes(q.id));
                if(reviewQs.length === 0) return;

                let prompt = "I found these questions hard to solve. Instead of discussing each question separately, please create a well-organized and structured tutorial based on the information in these questions, along with the relevant basics, so I can read and learn\n\n";
                reviewQs.forEach((q, i) => {
                    const optionsText = q.o.map((opt, idx) => `${String.fromCharCode(65+idx)}. ${opt}`).join('\n');
                    prompt += `Q${i+1}: ${q.q}\nOptions:\n${optionsText}\n\n`;
                });

                navigator.clipboard.writeText(prompt).then(() => {
                    window.open('https://chatgpt.com/', '_blank');
                    showAlert('✅ Prompt copied to clipboard!\n\nChatGPT is opening — just paste (Ctrl+V) into the chat box.');
                }).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = prompt;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.focus();
                    ta.select();
                    try {
                        document.execCommand('copy');
                        window.open('https://chatgpt.com/', '_blank');
                        showAlert('✅ Prompt copied to clipboard!\n\nChatGPT is opening — just paste (Ctrl+V) into the chat box.');
                    } catch(e) {
                        window.open('https://chatgpt.com/', '_blank');
                        showAlert('⚠️ Could not auto-copy.\n\nChatGPT is opening. Please manually copy your questions and paste them.');
                    }
                    document.body.removeChild(ta);
                });
            };

            const chatGptMainTopic = (mainIdx) => {
                const topic = topicsData[mainIdx];
                const hwIds = Array.from(new Set([...wrongIds, ...hardIds]));
                const targetQs = flatQuestions.filter(q => q.main === topic.main && hwIds.includes(q.id));
                if (targetQs.length === 0) {
                    showAlert(`You don't have any hard/wrong questions in ${topic.main} to generate a tutorial.`);
                    return;
                }
                generateTutorialWithChatGPT(targetQs);
            };

            const navigateHome = () => {
                setIsResolveSession(false);
                setIsMarkedSession(false);
                setView('menu');
                triggerBadgeModalIfAny();
            };

            const nextQuestion = () => {
                if (currentQIndex < activeQuiz.length - 1) {
                    setCurrentQIndex(currentQIndex + 1);
                    setShowExplanation(false);
                } else {
                    setIsResolveSession(false);
                    setIsMarkedSession(false);
                    setSessionAnswers({});
                    setView('results');
                    triggerBadgeModalIfAny();
                }
            };

            const prevQuestion = () => {
                if (currentQIndex > 0) {
                    setCurrentQIndex(currentQIndex - 1);
                    setShowExplanation(false);
                }
            };

            const getPercentage = (val, total) => total > 0 ? Math.round((val / total) * 100) : 0;
            const tColor = colorsMap[activeColorTheme] || colorsMap['slate'];

            return (
                <div className={`min-h-screen transition-colors pb-12 font-sans relative ${view === 'menu' ? 'home-bg' : (view === 'quiz' ? 'quiz-bg' : 'bg-slate-50 dark:bg-slate-900')} text-slate-800 dark:text-slate-100`}>
                    
                    {/* HEADER */}
                    <header className="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 shadow-sm sticky top-0 z-10 transition-colors">
                        <div className="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center text-slate-800 dark:text-slate-100">
                            <h1 className="text-xl font-bold flex items-center gap-2">
                                <svg className="w-6 h-6 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg>
                                Sub-Surgery Past Papers
                            </h1>
                            <div className="flex items-center gap-4">
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                                    {isDarkMode ? 
                                        <svg className="w-5 h-5 text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clipRule="evenodd" /></svg>
                                        : 
                                        <svg className="w-5 h-5 text-slate-500" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" /></svg>
                                    }
                                </button>
                                {view !== 'menu' && (
                                    <button onClick={navigateHome} className="text-sm font-bold bg-slate-200 dark:bg-slate-700 px-3 py-1.5 rounded-lg hover:bg-slate-300 dark:hover:bg-slate-600 transition">
                                        Back Home
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto px-4 mt-8">
                        {/* VIEW: MENU / DASHBOARD */}
                        {view === 'menu' && (
                            <div className="fade-in text-slate-800 dark:text-slate-100">
                                <div className="inline-block bg-black text-white px-4 py-2 rounded-lg text-sm font-semibold mb-6 shadow-sm">
                                    designed by Mahmoud Ismail
                                </div>

                                {/* DASHBOARD WIDGET */}
                                <div className="bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 mb-8 transition-colors">
                                    <h2 className="text-xl font-bold mb-4">📚 Your Dashboard</h2>
                                    
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                                        <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-xl text-center border border-slate-100 dark:border-slate-600">
                                            <div className="text-2xl font-black text-blue-600 dark:text-blue-400">
                                                {totalAnswered} <span className="text-sm text-slate-400 font-normal">({getPercentage(totalAnswered, TOTAL_QUESTIONS)}%)</span>
                                            </div>
                                            <div className="text-xs font-semibold text-slate-500 dark:text-slate-300 uppercase mt-1">Completed</div>
                                        </div>
                                        <div className="bg-green-50 dark:bg-green-900/20 p-4 rounded-xl text-center border border-green-100 dark:border-green-800">
                                            <div className="text-2xl font-black text-green-600 dark:text-green-400">
                                                {correctIds.length} <span className="text-sm font-normal opacity-70">({getPercentage(correctIds.length, TOTAL_QUESTIONS)}%)</span>
                                            </div>
                                            <div className="text-xs font-semibold text-green-600 dark:text-green-500 uppercase mt-1">Right</div>
                                        </div>
                                        <div className="bg-red-50 dark:bg-red-900/20 p-4 rounded-xl text-center border border-red-100 dark:border-red-800">
                                            <div className="text-2xl font-black text-red-600 dark:text-red-400">
                                                {wrongIds.length} <span className="text-sm font-normal opacity-70">({getPercentage(wrongIds.length, TOTAL_QUESTIONS)}%)</span>
                                            </div>
                                            <div className="text-xs font-semibold text-red-600 dark:text-red-500 uppercase mt-1">Wrong</div>
                                        </div>
                                        <div className="bg-orange-50 dark:bg-orange-900/20 p-4 rounded-xl text-center border border-orange-100 dark:border-orange-800">
                                            <div className="text-2xl font-black text-orange-600 dark:text-orange-400">
                                                {unansweredCount} <span className="text-sm font-normal opacity-70">({getPercentage(unansweredCount, TOTAL_QUESTIONS)}%)</span>
                                            </div>
                                            <div className="text-xs font-semibold text-orange-600 dark:text-orange-500 uppercase mt-1">Unanswered</div>
                                        </div>
                                    </div>
                                    
                                    {/* BADGES DISPLAY */}
                                    <div className="bg-slate-50 dark:bg-slate-900/50 p-4 rounded-xl border border-slate-100 dark:border-slate-700">
                                        <div className="flex flex-col sm:flex-row justify-between text-sm font-semibold text-slate-600 dark:text-slate-400 mb-3 gap-2">
                                            <span>Badges Collection</span>
                                            {nextBadge && (
                                                <span className="bg-blue-100 text-blue-800 dark:bg-blue-900/50 dark:text-blue-300 px-3 py-1 rounded-full text-xs">
                                                    Target: <strong>{nextBadge.req - correctIds.length}</strong> more correct answers for next badge!
                                                </span>
                                            )}
                                        </div>
                                        <div className="flex items-center gap-3 overflow-x-auto pb-2">
                                            {BADGES.map((b, i) => {
                                                const earned = earnedBadgeIds.includes(b.id);
                                                return earned ? (
                                                    <div key={i} className="flex-shrink-0 w-20 h-20 flex flex-col items-center justify-center p-2 rounded-xl bg-yellow-50 dark:bg-yellow-900/20 border border-yellow-200 dark:border-yellow-700 shadow-sm transition-transform hover:scale-105" title={`${b.label}`}>
                                                        <span className="text-4xl drop-shadow-sm mb-1 animate-bounce">{b.icon}</span>
                                                    </div>
                                                ) : (
                                                    <div key={i} className="flex-shrink-0 w-20 h-20 rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-600 flex items-center justify-center opacity-40">
                                                        <span className="text-xs font-bold text-center">{b.label}</span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>

                                <div className="mb-4">
                                    <h2 className="text-2xl font-bold mb-2">Global Actions</h2>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                    <button onClick={startRandomMaster} className="flex-1 p-6 bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl shadow-sm hover:shadow-md transition text-left group">
                                        <div className="flex justify-between items-center">
                                            <div>
                                                <h3 className="text-xl font-bold text-white mb-1">Random Master Quiz</h3>
                                                <p className="text-blue-100 text-sm">Continue all unsolved questions</p>
                                            </div>
                                            <div className="bg-white/20 p-3 rounded-full group-hover:bg-white/30 transition">
                                                <svg className="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                            </div>
                                        </div>
                                    </button>
                                    <button onClick={reviewSolvedQuestions} className="flex-1 p-6 bg-gradient-to-r from-slate-200 to-slate-300 dark:from-slate-700 dark:to-slate-600 rounded-2xl shadow-sm hover:shadow-md transition text-left group">
                                        <div className="flex justify-between items-center">
                                            <div>
                                                <h3 className="text-xl font-bold text-slate-800 dark:text-white mb-1">Review Solved Qs</h3>
                                                <p className="text-slate-600 dark:text-slate-300 text-sm">See answers for completed questions</p>
                                            </div>
                                            <div className="bg-white/50 dark:bg-black/20 p-3 rounded-full group-hover:bg-white/70 dark:group-hover:bg-black/40 transition">
                                                <svg className="w-6 h-6 text-slate-700 dark:text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                                            </div>
                                        </div>
                                    </button>
                                </div>

                                {hardOrWrongIds.length > 0 && (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                        <button onClick={resolveReviewQuestions} className="flex-1 p-5 bg-gradient-to-r from-rose-500 to-red-600 rounded-2xl shadow-sm hover:shadow-md transition text-left group">
                                            <div className="flex justify-between items-center">
                                                <div>
                                                    <h3 className="text-lg font-bold text-white mb-1">Re-solve Hard/Wrong</h3>
                                                    <p className="text-red-100 text-sm">{hardOrWrongIds.length} question(s) to review</p>
                                                </div>
                                            </div>
                                        </button>
                                        <button onClick={() => generateTutorialWithChatGPT(null)} className="flex-1 p-5 bg-[#10a37f] dark:bg-[#0d8a6a] rounded-2xl shadow-sm hover:shadow-md transition group text-white flex items-center justify-between">
                                            <div>
                                                <h3 className="text-lg font-bold mb-1 flex items-center gap-2">
                                                    <ChatGPTIcon className="w-6 h-6 text-white"/> ChatGPT Tutorial
                                                </h3>
                                                <p className="text-emerald-100 text-sm opacity-90">Generate guide for Hard/Wrong Qs</p>
                                            </div>
                                        </button>
                                    </div>
                                )}

                                {markedIds.length > 0 && (
                                    <button onClick={reviewMarkedQuestions} className="w-full p-5 mb-4 bg-amber-500 rounded-2xl shadow-sm hover:bg-amber-600 transition text-left text-white flex justify-between items-center">
                                        <div>
                                            <h3 className="text-lg font-bold mb-1 flex items-center gap-2">
                                                <BookmarkIcon className="w-5 h-5"/> Review Marked Questions ({markedIds.length})
                                            </h3>
                                            <p className="text-amber-100 text-sm">Questions you saved for later review (Practice mode)</p>
                                        </div>
                                    </button>
                                )}

                                {/* SMALL RESET ALL BUTTON */}
                                <div className="flex justify-end mb-8">
                                    <button onClick={resetAll} className="text-xs font-semibold text-red-500 hover:text-red-700 dark:text-red-400 dark:hover:text-red-300 flex items-center gap-1 px-4 py-2 bg-red-50 hover:bg-red-100 dark:bg-red-900/10 dark:hover:bg-red-900/20 rounded-lg transition border border-red-100 dark:border-red-900/30">
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                                        Reset All Progress
                                    </button>
                                </div>

                                <div className="mb-4">
                                    <h2 className="text-2xl font-bold mb-2">Main Subjects</h2>
                                </div>

                                <div className="flex flex-col gap-4 mb-8">
                                    {topicsData.map((topic, mainIdx) => {
                                        const topicQIds = flatQuestions.filter(q => q.main === topic.main).map(q => q.id);
                                        const totalQs = topicQIds.length;
                                        const answeredInTopic = topicQIds.filter(id => globalAnswers[id] !== undefined).length;
                                        const isExpanded = expandedTopic === mainIdx;
                                        const colorTheme = colorsMap[topic.color];

                                        return (
                                            <div key={mainIdx} className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm transition overflow-hidden">
                                                <button onClick={() => setExpandedTopic(isExpanded ? null : mainIdx)} className={`w-full p-5 text-left flex justify-between items-center transition ${colorTheme.gradient} text-white`}>
                                                    <div className="flex-grow">
                                                        <h3 className="font-bold text-xl mb-1 drop-shadow-sm">{topic.main}</h3>
                                                        <div className="flex items-center text-sm text-white/90 gap-4 font-medium">
                                                            <span>{answeredInTopic} / {totalQs} Answered</span>
                                                        </div>
                                                        <div className={`w-full ${colorTheme.progressBg} h-1.5 mt-3 rounded-full overflow-hidden max-w-sm shadow-inner`}>
                                                            <div className={`h-1.5 ${colorTheme.progressFill}`} style={{width: `${getPercentage(answeredInTopic, totalQs)}%`}}></div>
                                                        </div>
                                                    </div>
                                                    <div className="flex-shrink-0 ml-4">
                                                        <svg className={`w-6 h-6 transform transition-transform ${isExpanded ? 'rotate-180 text-white' : 'text-white/80'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" /></svg>
                                                    </div>
                                                </button>

                                                {isExpanded && (
                                                    <div className={`border-t border-slate-200 dark:border-slate-700 fade-in ${colorTheme.bg}`}>
                                                        {/* Main Topic Controls */}
                                                        <div className="p-4 flex flex-wrap gap-2 border-b border-white/20 dark:border-slate-700/30">
                                                            <button onClick={() => startTopicRandomMaster(mainIdx)} className="text-xs font-bold px-3 py-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 hover:shadow-sm transition">
                                                                🎲 Random Solve
                                                            </button>
                                                            <button onClick={() => reviewMainTopic(mainIdx)} className="text-xs font-bold px-3 py-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 hover:shadow-sm transition">
                                                                👀 Review Solved
                                                            </button>
                                                            <button onClick={() => resolveMainTopic(mainIdx)} className="text-xs font-bold px-3 py-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 hover:shadow-sm transition text-red-600 dark:text-red-400">
                                                                🔥 Re-solve Hard
                                                            </button>
                                                            <button onClick={() => chatGptMainTopic(mainIdx)} className="text-xs font-bold px-3 py-2 rounded-lg bg-[#10a37f] text-white hover:bg-[#0e906f] transition flex items-center gap-1">
                                                                <ChatGPTIcon className="w-4 h-4"/> Ask ChatGPT
                                                            </button>
                                                            <div className="flex-grow"></div>
                                                            <button onClick={(e) => resetMainTopic(e, mainIdx)} className="text-xs font-bold px-3 py-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 transition">
                                                                Reset Topic
                                                            </button>
                                                        </div>

                                                        {/* Subtopics List */}
                                                        <div className="divide-y divide-white/40 dark:divide-slate-700/40">
                                                            {topic.subtopics.map((sub, subIdx) => {
                                                                const subQs = flatQuestions.filter(q => q.main === topic.main && q.t === sub.t);
                                                                const subTotal = subQs.length;
                                                                const subAns = subQs.filter(q => globalAnswers[q.id] !== undefined).length;
                                                                
                                                                return (
                                                                    <div key={subIdx} className="p-4 hover:bg-white/40 dark:hover:bg-slate-800/40 transition flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                                                        <div className="flex-grow">
                                                                            <h4 className={`font-semibold ${colorTheme.text.split(' ')[0]} dark:text-slate-200`}>{sub.t}</h4>
                                                                            <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">{subAns} / {subTotal} questions answered</p>
                                                                        </div>
                                                                        <div className="flex flex-wrap items-center gap-2">
                                                                            <button onClick={() => startSubtopic(mainIdx, subIdx)} disabled={subTotal === 0} className={`text-xs font-bold px-4 py-2 rounded-lg text-white transition ${subTotal === 0 ? 'bg-slate-300 dark:bg-slate-600 cursor-not-allowed' : colorTheme.btn}`}>
                                                                                Solve
                                                                            </button>
                                                                            {subAns > 0 && (
                                                                                <>
                                                                                    <button onClick={(e) => reviewSubtopic(e, mainIdx, subIdx)} className="text-xs font-semibold px-3 py-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 hover:shadow-sm transition">
                                                                                        Review
                                                                                    </button>
                                                                                    <button onClick={(e) => resetSubtopic(e, mainIdx, subIdx)} className="text-xs font-semibold px-3 py-2 rounded-lg text-red-600 bg-red-50 hover:bg-red-100 dark:text-red-400 dark:bg-red-900/20 dark:hover:bg-red-900/40 transition">
                                                                                        Reset
                                                                                    </button>
                                                                                </>
                                                                            )}
                                                                        </div>
                                                                    </div>
                                                                )
                                                            })}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        )}

                        {/* VIEW: QUIZ */}
                        {view === 'quiz' && activeQuiz.length > 0 && (
                            <div className="fade-in max-w-3xl mx-auto">
                                <div className="mb-6">
                                    <p className={`text-sm font-bold uppercase tracking-wider mb-1 ${tColor.text}`}>
                                        {quizTitle} {isMarkedSession && "(Practice Mode)"}
                                    </p>
                                    <h2 className="text-2xl font-bold">
                                        Question {currentQIndex + 1} <span className="text-slate-400 text-lg font-normal">of {activeQuiz.length}</span>
                                    </h2>
                                </div>

                                <div className="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2 mb-8 overflow-hidden shadow-inner">
                                    <div className={`h-2 transition-all duration-300 ease-out ${tColor.btn.split(' ')[0]}`} style={{ width: `${((currentQIndex + 1) / activeQuiz.length) * 100}%` }}></div>
                                </div>

                                <div className={`bg-white dark:bg-slate-800 border-2 rounded-2xl p-6 md:p-8 shadow-sm mb-6 transition-colors ${tColor.border}`}>
                                    <h3 className="text-lg md:text-xl font-medium leading-relaxed mb-6">
                                        {activeQuiz[currentQIndex].q}
                                    </h3>

                                    <div className="space-y-4">
                                        {activeQuiz[currentQIndex].shuffledIndices.map((origIdx, renderIdx) => {
                                            const currentQ = activeQuiz[currentQIndex];
                                            const currentQId = currentQ.id;
                                            
                                            // Determine answered state based on session type
                                            const isAnswered = (isResolveSession || isMarkedSession) ? sessionAnswers[currentQId] !== undefined : globalAnswers[currentQId] !== undefined;
                                            const isSelected = (isResolveSession || isMarkedSession) ? sessionAnswers[currentQId] === origIdx : globalAnswers[currentQId] === origIdx;
                                            const isCorrect = currentQ.a === origIdx;
                                            const optionText = currentQ.o[origIdx];
                                            
                                            let btnClass = "w-full text-left p-4 rounded-xl border-2 transition-all duration-200 flex items-start gap-3 ";
                                            
                                            if (!isAnswered) {
                                                btnClass += "border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-700/50 hover:bg-slate-100 dark:hover:bg-slate-600 cursor-pointer";
                                            } else {
                                                if (isCorrect) {
                                                    btnClass += "border-green-500 bg-green-50 dark:bg-green-900/30 text-green-900 dark:text-green-100";
                                                } else if (isSelected) {
                                                    btnClass += "border-red-400 bg-red-50 dark:bg-red-900/30 text-red-900 dark:text-red-100";
                                                } else {
                                                    btnClass += "border-slate-100 dark:border-slate-700 bg-white dark:bg-slate-800 opacity-50";
                                                }
                                            }

                                            return (
                                                <div key={renderIdx} className="flex flex-col gap-1">
                                                    <button onClick={() => handleOptionClick(origIdx)} className={btnClass} disabled={isAnswered}>
                                                        <span className={`flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-sm font-bold border ${isAnswered ? (isCorrect ? 'bg-green-500 border-green-500 text-white' : (isSelected ? 'bg-red-500 border-red-500 text-white' : 'border-slate-300 dark:border-slate-600 text-slate-400')) : 'border-slate-300 dark:border-slate-500 text-slate-500 dark:text-slate-300'}`}>
                                                            {String.fromCharCode(65 + renderIdx)}
                                                        </span>
                                                        <span className="mt-0.5 leading-snug">{optionText}</span>
                                                    </button>
                                                    
                                                    {isAnswered && showExplanation && currentQ.oExp && currentQ.oExp[origIdx] && (
                                                        <div className="pl-12 pr-4 text-sm fade-in mt-1">
                                                            <div className={`p-3 rounded-lg border ${isCorrect ? 'bg-green-50/50 border-green-100 dark:bg-green-900/10 dark:border-green-800/50' : (isSelected ? 'bg-red-50/50 border-red-100 dark:bg-red-900/10 dark:border-red-800/50' : 'bg-slate-50 border-slate-100 dark:bg-slate-800 dark:border-slate-700')}`}>
                                                                <span className="text-slate-700 dark:text-slate-300 leading-relaxed">
                                                                    {currentQ.aiOptIndices && currentQ.aiOptIndices.includes(origIdx) && (
                                                                        <span className="text-purple-600 dark:text-purple-400 font-bold mr-1">✨ AI option: </span>
                                                                    )}
                                                                    {currentQ.oExp[origIdx]}
                                                                </span>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>

                                    {/* Evaluation Automatically displays if answered */}
                                    {((isResolveSession || isMarkedSession) ? sessionAnswers[activeQuiz[currentQIndex].id] !== undefined : globalAnswers[activeQuiz[currentQIndex].id] !== undefined) && activeQuiz[currentQIndex].evaluation && (
                                        <div className="mt-6 p-4 bg-indigo-50 dark:bg-indigo-900/20 border border-indigo-200 dark:border-indigo-800 rounded-xl text-sm text-indigo-900 dark:text-indigo-200 fade-in shadow-sm">
                                            <strong className="block mb-1 text-indigo-700 dark:text-indigo-400">📝 Evaluation:</strong> {activeQuiz[currentQIndex].evaluation}
                                        </div>
                                    )}

                                    {((isResolveSession || isMarkedSession) ? sessionAnswers[activeQuiz[currentQIndex].id] !== undefined : globalAnswers[activeQuiz[currentQIndex].id] !== undefined) && (
                                        <div className="mt-4 flex justify-between items-center border-t border-slate-100 dark:border-slate-700 pt-4">
                                            <button onClick={() => setShowExplanation(!showExplanation)} className={`text-sm font-bold ${tColor.text} hover:opacity-80 transition flex items-center gap-1`}>
                                                {showExplanation ? 'Hide Explanations ▲' : 'Show Explanations ▼'}
                                            </button>
                                            <button onClick={askChatGPTPerQuestion} className="text-sm font-bold text-[#10a37f] dark:text-[#0d8a6a] hover:opacity-80 transition flex items-center gap-1">
                                                <ChatGPTIcon className="w-4 h-4"/> Ask ChatGPT
                                            </button>
                                        </div>
                                    )}

                                    <div className="mt-6 flex items-center gap-2">
                                        <input type="checkbox" id="markLater" checked={markedIds.includes(activeQuiz[currentQIndex].id)} onChange={toggleMark} className="w-5 h-5 text-amber-500 bg-slate-100 border-slate-300 rounded focus:ring-amber-500 dark:focus:ring-amber-600 dark:ring-offset-slate-800 dark:bg-slate-700 dark:border-slate-600 cursor-pointer"/>
                                        <label htmlFor="markLater" className="text-sm font-semibold text-slate-600 dark:text-slate-300 cursor-pointer select-none">
                                            Mark this question to review later
                                        </label>
                                    </div>
                                </div>

                                <div className="flex flex-wrap sm:flex-nowrap justify-between items-center gap-4">
                                    <button onClick={prevQuestion} disabled={currentQIndex === 0} className="px-4 py-3 font-medium text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 disabled:opacity-30 transition">
                                        &larr; Previous
                                    </button>
                                    
                                    <div className="flex gap-2 w-full sm:w-auto">
                                        <button onClick={toggleHard} className={`px-4 py-3 rounded-xl font-bold border transition flex items-center gap-2 flex-1 sm:flex-none justify-center ${hardIds.includes(activeQuiz[currentQIndex].id) ? 'bg-slate-800 text-white border-slate-800 dark:bg-white dark:text-slate-900 dark:border-white' : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50 dark:bg-slate-800 dark:border-slate-700 dark:hover:bg-slate-700'}`}>
                                            {hardIds.includes(activeQuiz[currentQIndex].id) ? 'Hard (Added)' : 'Mark Hard'}
                                        </button>
                                        <button onClick={nextQuestion} className={`px-6 py-3 rounded-xl font-bold transition shadow-sm flex-1 sm:flex-none justify-center flex items-center text-white ${tColor.btn}`}>
                                            {currentQIndex === activeQuiz.length - 1 ? 'Finish' : 'Next'} &rarr;
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* VIEW: RESULTS */}
                        {view === 'results' && (
                            <div className="fade-in max-w-2xl mx-auto py-8">
                                <div className="text-center mb-8">
                                    <div className={`w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 ${tColor.bg}`}>
                                        <svg className={`w-10 h-10 ${tColor.text.split(' ')[0]}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" /></svg>
                                    </div>
                                    <h2 className="text-3xl font-bold mb-1">Session Completed!</h2>
                                </div>
                                <div className="flex justify-center">
                                    <button onClick={navigateHome} className="px-8 py-4 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 font-bold rounded-xl hover:bg-slate-50 dark:hover:bg-slate-700 transition shadow-sm">
                                        Back to Dashboard
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* BADGE MODAL */}
                        {showBadgeModal && pendingBadgeAlerts.length > 0 && (
                            <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 fade-in">
                                <div className="bg-white dark:bg-slate-800 rounded-2xl p-8 max-w-sm w-full text-center shadow-2xl scale-up border border-slate-200 dark:border-slate-700 relative">
                                    <button onClick={closeBadgeModal} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12"/></svg>
                                    </button>
                                    <div className="text-6xl mb-4 drop-shadow-md animate-bounce">
                                        {pendingBadgeAlerts[pendingBadgeAlerts.length - 1].icon}
                                    </div>
                                    <h3 className="text-2xl font-black text-slate-800 dark:text-white mb-2">Congratulations! 🎉</h3>
                                    <p className="text-slate-600 dark:text-slate-300 font-medium mb-4">
                                        You unlocked the <strong className="text-blue-600 dark:text-blue-400">{pendingBadgeAlerts[pendingBadgeAlerts.length - 1].label}</strong> badge!
                                    </p>
                                    
                                    {pendingBadgeAlerts[pendingBadgeAlerts.length - 1].msg && (
                                        <div className="mb-6 p-4 bg-blue-50 dark:bg-blue-900/20 rounded-xl text-sm text-blue-800 dark:text-blue-200 text-left italic">
                                            {pendingBadgeAlerts[pendingBadgeAlerts.length - 1].msg.split('\n').map((line, idx) => (
                                                <span key={idx}>{line}<br/></span>
                                            ))}
                                        </div>
                                    )}

                                    <button onClick={closeBadgeModal} className="w-full py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition shadow-sm">
                                        Awesome!
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* GLOBAL DIALOG */}
                        {dialog.isOpen && (
                            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 fade-in">
                                <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl scale-up border border-slate-200 dark:border-slate-700">
                                    <p className="text-lg font-semibold text-slate-800 dark:text-white mb-6 whitespace-pre-wrap">
                                        {dialog.message}
                                    </p>
                                    <div className="flex justify-end gap-3">
                                        {dialog.type === 'confirm' && (
                                            <button onClick={() => setDialog({ ...dialog, isOpen: false })} className="px-4 py-2 font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition">
                                                Cancel
                                            </button>
                                        )}
                                        <button onClick={() => { if (dialog.onConfirm) dialog.onConfirm(); setDialog({ ...dialog, isOpen: false }); }} className="px-4 py-2 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition shadow-sm">
                                            {dialog.type === 'confirm' ? 'Confirm' : 'OK'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
