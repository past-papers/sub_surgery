        /* ========================================================

        /* ========================================================

           ======================================================== */
        .gld-bg { background: #0a0300; }
        .gld-gradient-slider {
            position: absolute; inset: -35%; width: 170%; height: 170%;
            background: radial-gradient(circle at 78% 18%, rgba(255, 225, 80, 0.34), transparent 28%),

            background-size: 120% 120%; will-change: transform; transform: translate3d(0, 0, 0);
            animation: premiumGradientFlow 18s ease-in-out infinite alternate;
        }
        @keyframes premiumGradientFlow {
            0% { transform: translate3d(-7%, -5%, 0) rotate(0deg) scale(1.04); }
            25% { transform: translate3d(4%, -8%, 0) rotate(2deg) scale(1.08); }
            50% { transform: translate3d(7%, 5%, 0) rotate(-2deg) scale(1.05); }
            75% { transform: translate3d(-4%, 8%, 0) rotate(1deg) scale(1.09); }
            100% { transform: translate3d(-8%, 2%, 0) rotate(-1deg) scale(1.06); }
        }
        .gld-bubbles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
        .gld-bubble {
            position: absolute; border-radius: 50%; filter: blur(0.5px); opacity: 0.42; will-change: transform, opacity; transform: translate3d(0, 0, 0);
            background: radial-gradient(circle at 34% 28%, rgba(255, 250, 180, 0.34), rgba(255, 187, 0, 0.16) 34%, rgba(255, 96, 0, 0.06) 58%, transparent 72%);
            animation: bubbleDrift var(--duration) ease-in-out infinite alternate; animation-delay: var(--delay);
        }
        .gld-bubble::after { content: ""; position: absolute; inset: 14%; border-radius: inherit; border: 1px solid rgba(255, 232, 145, 0.13); box-shadow: inset 0 0 30px rgba(255, 218, 80, 0.08), 0 0 50px rgba(255, 155, 0, 0.08); }
        .gld-b1 { width: 360px; height: 360px; top: 8%; left: 8%; --duration: 22s; --delay: -4s; }
        .gld-b2 { width: 520px; height: 520px; top: 48%; right: -8%; opacity: 0.34; --duration: 28s; --delay: -10s; }
        .gld-b3 { width: 300px; height: 300px; bottom: -8%; left: 24%; opacity: 0.28; --duration: 24s; --delay: -14s; }
        .gld-b4 { width: 430px; height: 430px; top: -12%; right: 18%; opacity: 0.25; --duration: 30s; --delay: -7s; }
        @keyframes bubbleDrift {
            0% { transform: translate3d(-25px, 18px, 0) scale(0.96); opacity: 0.22; }
            35% { transform: translate3d(45px, -35px, 0) scale(1.04); opacity: 0.42; }
            70% { transform: translate3d(-35px, -58px, 0) scale(1.08); opacity: 0.32; }
            100% { transform: translate3d(38px, 42px, 0) scale(1); opacity: 0.48; }
        }
        .gld-dynamic-light { position: absolute; inset: -25%; z-index: 2; background: linear-gradient(125deg, transparent 0%, rgba(255, 174, 0, 0.10) 24%, rgba(255, 245, 150, 0.24) 48%, rgba(255, 130, 0, 0.11) 68%, transparent 100%); mix-blend-mode: screen; will-change: transform; transform: translate3d(0, 0, 0); }
        .gld-streaks { position: absolute; inset: -35%; z-index: 3; opacity: 0.55; transform: rotate(-18deg) translate3d(0, 0, 0); will-change: transform; animation: colorShift 18s linear infinite; background: linear-gradient(90deg, transparent, rgba(255, 100, 150, 0.32), transparent) 0 12% / 52% 2px no-repeat, linear-gradient(90deg, transparent, rgba(100, 200, 255, 0.36), transparent) 18% 24% / 66% 2px no-repeat, linear-gradient(90deg, transparent, rgba(150, 255, 100, 0.20), transparent) 8% 39% / 48% 1px no-repeat, linear-gradient(90deg, transparent, rgba(255, 200, 50, 0.30), transparent) 34% 55% / 72% 2px no-repeat, linear-gradient(90deg, transparent, rgba(200, 100, 255, 0.22), transparent) 5% 72% / 58% 1px no-repeat, linear-gradient(90deg, transparent, rgba(255, 150, 50, 0.28), transparent) 28% 86% / 62% 2px no-repeat; }
        .gld-streaks.second { opacity: 0.34; transform: rotate(-18deg) translate3d(0, 0, 0) scale(1.25); animation: colorShift 24s linear infinite reverse; background: linear-gradient(90deg, transparent, rgba(255, 80, 120, 0.28), transparent) 10% 18% / 70% 2px no-repeat, linear-gradient(90deg, transparent, rgba(80, 255, 200, 0.22), transparent) 22% 48% / 64% 1px no-repeat, linear-gradient(90deg, transparent, rgba(255, 230, 80, 0.30), transparent) 5% 78% / 75% 2px no-repeat; }
        .gld-glow { position: absolute; z-index: 2; top: -18%; right: -12%; width: 70vw; height: 70vw; min-width: 520px; min-height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 240, 120, 0.25), transparent 62%); will-change: transform; transform: translate3d(0, 0, 0); pointer-events: none; }
        .gld-vignette { position: absolute; inset: 0; z-index: 5; background: radial-gradient(circle at center, transparent 0%, rgba(0, 0, 0, 0.20) 62%, rgba(0, 0, 0, 0.58) 100%), linear-gradient(90deg, rgba(0,0,0,0.58), transparent 58%), linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.12) 70%, rgba(0,0,0,0.72) 100%); pointer-events: none; }

        /* ========================================================

           ======================================================== */
        .medtech-bg {
            background: radial-gradient(ellipse at 20% 0%, #0f172a 0%, #020617 40%, #000000 100%);
        }
        .medtech-ambient-orb {
            position: absolute;

            transform: translate3d(0,0,0);
        }
        .medtech-ambient-1 {
            width: 70vw; height: 70vw; max-width: 800px; max-height: 800px;
            background: radial-gradient(circle, rgba(6,182,212,0.18), transparent 70%);

        .medtech-ambient-2 {

        }
        @keyframes medtechOrb3 {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(calc(-50% + 30px), calc(-50% - 40px)) scale(1.1); }
        }
        .medtech-grid-overlay {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 3;
            mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
        }
        .medtech-text-gradient {
            background: linear-gradient(135deg, #67e8f9 0%, #60a5fa 30%, #34d399 60%, #67e8f9 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: medtechGradientFlow 8s ease infinite;
        }
        @keyframes medtechGradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .medtech-scanline {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(6,182,212,0.015) 2px,
                rgba(6,182,212,0.015) 4px
            );
            pointer-events: none;
            z-index: 4;
            opacity: 0.6;
        }
        /* MedTech UI */
        .medtech-glass {
            background: rgba(2, 6, 23, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(34, 211, 238, 0.2);
            box-shadow: 0 0 60px rgba(0, 100, 200, 0.08), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .medtech-glass-strong {
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid rgba(34, 211, 238, 0.3);
            box-shadow: 0 0 80px rgba(0, 150, 255, 0.12), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .medtech-btn {
            background: rgba(6, 182, 212, 0.12);

        .medtech-btn-primary {
            background: linear-gradient(135deg, rgba(6,182,212,0.25), rgba(37,99,235,0.25));
            border: 1px solid rgba(34,211,238,0.5);
            color: #ecfeff;
            box-shadow: 0 0 20px rgba(6,182,212,0.15);
        }
        .medtech-btn-primary:hover {
            background: linear-gradient(135deg, rgba(6,182,212,0.4), rgba(37,99,235,0.4));
            box-shadow: 0 0 40px rgba(6,182,212,0.25);
            transform: translateY(-2px);
        }
        .medtech-btn-danger {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(248, 113, 113, 0.35);
            color: #fecaca;
        }
        .medtech-btn-danger:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: rgba(248, 113, 113, 0.6);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.15);
        }
        .medtech-btn-success {
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(52, 211, 153, 0.35);
            color: #bbf7d0;
        }
        .medtech-btn-success:hover {
            background: rgba(34, 197, 94, 0.25);
            border-color: rgba(52, 211, 153, 0.6);
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.15);
        }
        .medtech-correct {
            border-color: rgba(52, 211, 153, 0.6) !important;
            background: rgba(6, 78, 59, 0.6) !important;
            color: #a7f3d0 !important;
            box-shadow: 0 0 20px rgba(52,211,153,0.15) !important;
        }
        .medtech-wrong {
            border-color: rgba(248, 113, 113, 0.6) !important;
            background: rgba(127, 29, 29, 0.6) !important;

            box-shadow: 0 0 20px rgba(248,113,113,0.15) !important;
        }
        .medtech-option-default {
            border: 1px solid rgba(34, 211, 238, 0.15) !important;
            background: rgba(2, 6, 23, 0.5) !important;
            color: #ecfeff !important;
        }
        .medtech-option-default:hover {
            border-color: rgba(34, 211, 238, 0.4) !important;
            background: rgba(6, 182, 212, 0.1) !important;
        }
        .medtech-option-disabled {
            border: 1px solid rgba(255,255,255,0.05) !important;
            background: rgba(2,6,23,0.3) !important;

        }
        .medtech-input {
            background: rgba(2, 6, 23, 0.6) !important;
            border: 1px solid rgba(34, 211, 238, 0.25) !important;
            color: #ecfeff !important;
        }
        .medtech-input:focus {
            border-color: rgba(34, 211, 238, 0.6) !important;
            box-shadow: 0 0 15px rgba(6,182,212,0.15) !important;

        }
        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .medtech-ambient-1, .medtech-ambient-2, .medtech-ambient-3 { animation: none !important; }
        }

        /* ========================================================
           PREMIUM THEME 3: CALM (Interactive Canvas)
           ======================================================== */
        .canvas-bg-container { background-color: #030014; }

        /* ========================================================
           PREMIUM THEME 4: GEOMETRIC
           ======================================================== */
        .geo-hero { background: radial-gradient(circle at 30% 20%, #8ecbff 0%, transparent 35%), linear-gradient(160deg, #78b8f3 0%, #5da0e8 48%, #498bd8 100%); display: flex; align-items: center; justify-content: center; isolation: isolate; }
        .geo-hero::before { content: ""; position: absolute; inset: -20%; background: radial-gradient(circle at 20% 80%, rgba(176, 42, 85, 0.28), transparent 22%), radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.18), transparent 28%), radial-gradient(circle at 50% 50%, rgba(80, 157, 235, 0.22), transparent 40%); filter: blur(35px); animation: geoBgMove 14s ease-in-out infinite alternate; z-index: -3; will-change: transform; transform: translateZ(0); }
        .geo-orbit-line { position: absolute; width: 1200px; height: 1200px; border: 1px solid rgba(35, 78, 125, 0.35); border-radius: 50%; transform: rotate(47deg) translateY(90px); z-index: -1; opacity: 0.55; animation: orbitFloat 12s ease-in-out infinite alternate; will-change: transform; }
        .geo-scene { position: absolute; width: min(720px, 95vw); height: min(900px, 115vh); perspective: 1200px; transform-style: preserve-3d; animation: sceneDrift 8s ease-in-out infinite alternate; will-change: transform; }
        .geo-sphere { position: absolute; width: clamp(280px, 44vw, 520px); aspect-ratio: 1; border-radius: 50%; left: 50%; top: 8%; transform: translateX(-50%); background: radial-gradient(circle at 30% 25%, rgba(188, 224, 255, 0.95), transparent 22%), radial-gradient(circle at 68% 32%, rgba(160, 70, 135, 0.45), transparent 16%), radial-gradient(circle at 50% 50%, #74bcff 0%, #63adf4 55%, #549de8 100%); box-shadow: inset 18px 18px 35px rgba(255, 255, 255, 0.28), inset -22px -28px 45px rgba(52, 99, 165, 0.28), 0 35px 80px rgba(40, 102, 180, 0.35); border: 1px solid rgba(255, 255, 255, 0.42); z-index: 5; animation: sphereFloat 6s ease-in-out infinite alternate; will-change: transform; }
        .geo-sphere::after { content: ""; position: absolute; inset: 3%; border-radius: 50%; border-left: 2px solid rgba(255, 255, 255, 0.25); border-top: 1px solid rgba(255, 255, 255, 0.35); filter: blur(0.4px); }
        .geo-red-capsule-top { position: absolute; width: 160px; height: 250px; border-radius: 90px; background: linear-gradient(145deg, #d93261, #a91c49 65%, #7f123d); right: 12%; top: 8%; transform: rotate(28deg); box-shadow: inset 16px 10px 25px rgba(255, 255, 255, 0.18), inset -18px -18px 28px rgba(83, 0, 48, 0.22), 0 25px 55px rgba(126, 28, 83, 0.32); z-index: 3; animation: capsuleMove 7s ease-in-out infinite alternate; will-change: transform; }
        .geo-pink-ring { position: absolute; width: clamp(360px, 58vw, 680px); height: 78px; border-radius: 50%; left: 52%; top: 52%; transform: translateX(-50%) rotate(-9deg) skewX(-8deg); background: linear-gradient(180deg, rgba(255,255,255,0.25), transparent 35%), linear-gradient(90deg, #f083b0 0%, #cc3e78 42%, #ef315f 100%); box-shadow: inset 0 14px 20px rgba(255, 255, 255, 0.22), inset 0 -14px 18px rgba(155, 21, 78, 0.25), 0 20px 45px rgba(126, 38, 105, 0.26); z-index: 4; animation: ringFloat 5.5s ease-in-out infinite alternate; will-change: transform; }
        .geo-cylinder { position: absolute; width: clamp(220px, 28vw, 330px); height: clamp(145px, 18vw, 210px); border-radius: 50%; left: 50%; top: 56%; transform: translateX(-50%) rotate(13deg); background: radial-gradient(ellipse at 45% 25%, #6871c8 0%, #33336d 58%, #151432 100%); box-shadow: inset 18px 16px 24px rgba(255, 255, 255, 0.12), inset -24px -28px 32px rgba(9, 8, 34, 0.45), 0 35px 70px rgba(19, 24, 74, 0.42); z-index: 2; animation: cylinderFloat 6.2s ease-in-out infinite alternate; will-change: transform; }
        .geo-cylinder::before { content: ""; position: absolute; width: 100%; height: 70%; border-radius: 50%; top: -5%; left: 0; background: radial-gradient(ellipse at 35% 25%, #7781df 0%, #3d418b 62%, #25225e 100%); box-shadow: inset -10px -14px 25px rgba(7, 8, 30, 0.35); }
        .geo-glass-platform { position: absolute; width: clamp(460px, 80vw, 880px); height: 170px; border-radius: 50%; left: 48%; bottom: 12%; transform: translateX(-50%) rotate(29deg) skewX(-14deg); background: linear-gradient(180deg, rgba(255, 255, 255, 0.28), rgba(255,255,255,0.03)), linear-gradient(90deg, rgba(77, 88, 168, 0.7), rgba(169, 177, 230, 0.45), rgba(110, 173, 223, 0.55)); backdrop-filter: blur(8px); border: 1px solid rgba(205, 245, 255, 0.45); box-shadow: inset 0 14px 25px rgba(255,255,255,0.16), inset 0 -18px 22px rgba(41, 53, 137, 0.25), 0 45px 90px rgba(51, 78, 162, 0.34); z-index: 1; animation: platformFloat 8s ease-in-out infinite alternate; will-change: transform; }
        .geo-red-base { position: absolute; width: clamp(390px, 72vw, 790px); height: 125px; border-radius: 80px; left: 40%; bottom: 4%; transform: translateX(-50%) rotate(45deg); background: linear-gradient(120deg, #ed315c, #b9254d 50%, #822049); box-shadow: inset 18px 18px 28px rgba(255,255,255,0.18), inset -20px -20px 30px rgba(89, 0, 43, 0.28), 0 40px 70px rgba(114, 21, 68, 0.30); z-index: 0; animation: baseFloat 7.5s ease-in-out infinite alternate; will-change: transform; }
        .geo-soft-shadow { position: absolute; width: 420px; height: 150px; border-radius: 50%; background: rgba(33, 46, 116, 0.22); filter: blur(30px); left: 50%; bottom: 23%; transform: translateX(-50%) rotate(25deg); z-index: -1; animation: shadowPulse 6s ease-in-out infinite alternate; will-change: transform; opacity: 0.45; }

        @keyframes sceneDrift { from { transform: translate3d(-8px, -6px, 0) rotate(-1deg); } to { transform: translate3d(10px, 8px, 0) rotate(1.2deg); } }
        @keyframes sphereFloat { from { transform: translate3d(-50%, 0, 0) scale(1); } to { transform: translate3d(-50%, -18px, 0) scale(1.015); } }
        @keyframes capsuleMove { from { transform: translate3d(0, 0, 0) rotate(28deg); } to { transform: translate3d(0, -16px, 0) rotate(31deg); } }
        @keyframes ringFloat { from { transform: translate3d(-50%, 0, 0) rotate(-9deg) skewX(-8deg); } to { transform: translate3d(-50%, 12px, 0) rotate(-6deg) skewX(-8deg); } }
        @keyframes cylinderFloat { from { transform: translate3d(-50%, 0, 0) rotate(13deg); } to { transform: translate3d(-50%, 16px, 0) rotate(10deg); } }

        @media (max-width: 600px) { .geo-scene { transform: scale(0.92); } }

        /* Stop animations if reduced motion is preferred */
        @media (prefers-reduced-motion: reduce) {
            .gold-text-gradient, .bg-gradient-slider, .gold-bubble, .streaks-bg, .nature-bg-image, .geo-scene, .geo-hero::before, .geo-orbit-line, .geo-sphere, .geo-red-capsule-top, .geo-pink-ring, .geo-cylinder, .geo-glass-platform, .geo-red-base, .geo-soft-shadow { animation: none !important; transform: none !important; }
        }

                const handleMouseMove = (e) => { mouse.x = e.clientX; mouse.y = e.clientY; };
                const handleTouchMove = (e) => { if (e.touches.length > 0) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; } };
                const handleMouseLeave = () => { mouse.x = -1000; mouse.y = -1000; };

                window.addEventListener('resize', resize);
                window.addEventListener('mousemove', handleMouseMove, { passive: true });
                window.addEventListener('touchmove', handleTouchMove, { passive: true });
                window.addEventListener('mouseleave', handleMouseLeave);

                resize();
                animate();

                return () => {
                    window.removeEventListener('resize', resize); window.removeEventListener('mousemove', handleMouseMove); window.removeEventListener('touchmove', handleTouchMove); window.removeEventListener('mouseleave', handleMouseLeave);
                    cancelAnimationFrame(animationFrameId);
                };
            }, []);

            return <div className="premium-bg-layer canvas-bg-container"><canvas ref={canvasRef}></canvas></div>;
        });


        // --- MAIN APP ---

        const App = () => {
            const [view, setView] = useState('menu'); 
            const [activeQuiz, setActiveQuiz] = useState([]);
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [quizTitle, setQuizTitle] = useState("");

            useEffect(() => {

            // Force dark mode for all premium backgrounds to guarantee frosted glass readability

                            {dialog.isOpen && (
                                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-md p-4 fade-in">
                                    <div className={`rounded-2xl p-6 max-w-sm w-full shadow-2xl scale-up border ${isMedTech ? 'bg-slate-950 border-cyan-500/30 text-white' : (isPremium ? 'bg-slate-900 border-white/20 text-white' : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white')}`}>
                                        <p className="text-lg font-semibold mb-6 whitespace-pre-wrap leading-relaxed">
                                            {dialog.message}
                                        </p>
                                        <div className="flex justify-end gap-3">
                                            {dialog.type === 'confirm' && (
                                                <button onClick={() => setDialog({ ...dialog, isOpen: false })} className={`px-4 py-2 font-medium rounded-xl transition ${isMedTech ? 'medtech-btn' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700'}`}>
                                                    Cancel
                                                </button>
                                            )}
                                            <button onClick={() => { if (dialog.onConfirm) dialog.onConfirm(); setDialog({ ...dialog, isOpen: false }); }} className="px-5 py-2 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition shadow-sm border border-blue-500">
                                                {dialog.type === 'confirm' ? 'Confirm' : 'OK'}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
