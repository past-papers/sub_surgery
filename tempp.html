            });

                return q && (globalAnswers[id] !== q.a || hardIds.includes(id));
            });

                    prompt += `Q${i+1}: ${q.q}\nOptions:\n${optionsText}\n\n`;

                    window.open('https://chatgpt.com/', '_blank');
                    showAlert('✅ Prompt copied to clipboard!\n\nChatGPT is opening — just paste (Ctrl+V) into the chat box.');

                    ta.value = prompt;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.focus();

                                            const optionText = currentQ.o[origIdx];
                                            
                                            let btnClass = "w-full text-left p-4 rounded-xl border-2 transition-all duration-200 flex items-start gap-3 ";
                                            
                                            if (!isAnswered) {
                                                btnClass += "border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-700/50 hover:bg-slate-100 dark:hover:bg-slate-600 cursor-pointer";
                                            } else {
                                                if (isCorrect) {
                                                    btnClass += "border-green-500 bg-green-50 dark:bg-green-900/30 text-green-900 dark:text-green-100";
                                                } else if (isSelected) {
                                                    btnClass += "border-red-400 bg-red-50 dark:bg-red-900/30 text-red-900 dark:text-red-100";
                                                } else {
                                                    btnClass += "border-slate-100 dark:border-slate-700 bg-white dark:bg-slate-800 opacity-50";
                                                }
                                            }

                                            return (
                                                <div key={renderIdx} className="flex flex-col gap-1">
                                                    <button onClick={() => handleOptionClick(origIdx)} className={btnClass} disabled={isAnswered}>
                                                        <span className={`flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-sm font-bold border ${isAnswered ? (isCorrect ? 'bg-green-500 border-green-500 text-white' : (isSelected ? 'bg-red-500 border-red-500 text-white' : 'border-slate-300 dark:border-slate-600 text-slate-400')) : 'border-slate-300 dark:border-slate-500 text-slate-500 dark:text-slate-300'}`}>
                                                            {String.fromCharCode(65 + renderIdx)}
                                                        </span>
                                                        <span className="mt-0.5 leading-snug">{optionText}</span>
                                                    </button>
                                                    
                                                    {isAnswered && showExplanation && currentQ.oExp && currentQ.oExp[origIdx] && (
                                                        <div className="pl-12 pr-4 text-sm fade-in mt-1">
                                                            <div className={`p-3 rounded-lg border ${isCorrect ? 'bg-green-50/50 border-green-100 dark:bg-green-900/10 dark:border-green-800/50' : (isSelected ? 'bg-red-50/50 border-red-100 dark:bg-red-900/10 dark:border-red-800/50' : 'bg-slate-50 border-slate-100 dark:bg-slate-800 dark:border-slate-700')}`}>
                                                                <span className="text-slate-700 dark:text-slate-300 leading-relaxed">
                                                                    {currentQ.aiOptIndices && currentQ.aiOptIndices.includes(origIdx) && (
                                                                        <span className="text-purple-600 dark:text-purple-400 font-bold mr-1">✨ AI option: </span>
                                                                    )}
                                                                    {currentQ.oExp[origIdx]}
                                                                </span>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>

                                    {/* Evaluation Automatically displays if answered */}
                                    {((isResolveSession || isMarkedSession) ? sessionAnswers[activeQuiz[currentQIndex].id] !== undefined : globalAnswers[activeQuiz[currentQIndex].id] !== undefined) && activeQuiz[currentQIndex].evaluation && (
                                        <div className="mt-6 p-4 bg-indigo-50 dark:bg-indigo-900/20 border border-indigo-200 dark:border-indigo-800 rounded-xl text-sm text-indigo-900 dark:text-indigo-200 fade-in shadow-sm">
                                            <strong className="block mb-1 text-indigo-700 dark:text-indigo-400">📝 Evaluation:</strong> {activeQuiz[currentQIndex].evaluation}
                                        </div>
                                    )}

                                    {((isResolveSession || isMarkedSession) ? sessionAnswers[activeQuiz[currentQIndex].id] !== undefined : globalAnswers[activeQuiz[currentQIndex].id] !== undefined) && (
                                        <div className="mt-4 flex justify-between items-center border-t border-slate-100 dark:border-slate-700 pt-4">
                                            <button onClick={() => setShowExplanation(!showExplanation)} className={`text-sm font-bold ${tColor.text} hover:opacity-80 transition flex items-center gap-1`}>
                                                {showExplanation ? 'Hide Explanations ▲' : 'Show Explanations ▼'}
                                            </button>
                                            <button onClick={askChatGPTPerQuestion} className="text-sm font-bold text-[#10a37f] dark:text-[#0d8a6a] hover:opacity-80 transition flex items-center gap-1">
                                                <ChatGPTIcon className="w-4 h-4"/> Ask ChatGPT
                                            </button>
                                        </div>
                                    )}

                                    <div className="mt-6 flex items-center gap-2">
                                        <input type="checkbox" id="markLater" checked={markedIds.includes(activeQuiz[currentQIndex].id)} onChange={toggleMark} className="w-5 h-5 text-amber-500 bg-slate-100 border-slate-300 rounded focus:ring-amber-500 dark:focus:ring-amber-600 dark:ring-offset-slate-800 dark:bg-slate-700 dark:border-slate-600 cursor-pointer"/>
                                        <label htmlFor="markLater" className="text-sm font-semibold text-slate-600 dark:text-slate-300 cursor-pointer select-none">
                                            Mark this question to review later
                                        </label>
                                    </div>
                                </div>

                                <div className="flex flex-wrap sm:flex-nowrap justify-between items-center gap-4">
                                    <button onClick={prevQuestion} disabled={currentQIndex === 0} className="px-4 py-3 font-medium text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 disabled:opacity-30 transition">
                                        &larr; Previous
                                    </button>
                                    
                                    <div className="flex gap-2 w-full sm:w-auto">
                                        <button onClick={toggleHard} className={`px-4 py-3 rounded-xl font-bold border transition flex items-center gap-2 flex-1 sm:flex-none justify-center ${hardIds.includes(activeQuiz[currentQIndex].id) ? 'bg-slate-800 text-white border-slate-800 dark:bg-white dark:text-slate-900 dark:border-white' : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50 dark:bg-slate-800 dark:border-slate-700 dark:hover:bg-slate-700'}`}>
                                            {hardIds.includes(activeQuiz[currentQIndex].id) ? 'Hard (Added)' : 'Mark Hard'}
                                        </button>
                                        <button onClick={nextQuestion} className={`px-6 py-3 rounded-xl font-bold transition shadow-sm flex-1 sm:flex-none justify-center flex items-center text-white ${tColor.btn}`}>
                                            {currentQIndex === activeQuiz.length - 1 ? 'Finish' : 'Next'} &rarr;
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* VIEW: RESULTS */}
                        {view === 'results' && (
                            <div className="fade-in max-w-2xl mx-auto py-8">
                                <div className="text-center mb-8">
                                    <div className={`w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 ${tColor.bg}`}>
                                        <svg className={`w-10 h-10 ${tColor.text.split(' ')[0]}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" /></svg>
                                    </div>
                                    <h2 className="text-3xl font-bold mb-1">Session Completed!</h2>
                                </div>
                                <div className="flex justify-center">
                                    <button onClick={navigateHome} className="px-8 py-4 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 font-bold rounded-xl hover:bg-slate-50 dark:hover:bg-slate-700 transition shadow-sm">
                                        Back to Dashboard
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* BADGE MODAL */}
                        {showBadgeModal && pendingBadgeAlerts.length > 0 && (
                            <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 fade-in">
                                <div className="bg-white dark:bg-slate-800 rounded-2xl p-8 max-w-sm w-full text-center shadow-2xl scale-up border border-slate-200 dark:border-slate-700 relative">
                                    <button onClick={closeBadgeModal} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12"/></svg>
                                    </button>
                                    <div className="text-6xl mb-4 drop-shadow-md animate-bounce">
                                        {pendingBadgeAlerts[pendingBadgeAlerts.length - 1].icon}
                                    </div>
                                    <h3 className="text-2xl font-black text-slate-800 dark:text-white mb-2">Congratulations! 🎉</h3>
                                    <p className="text-slate-600 dark:text-slate-300 font-medium mb-4">
                                        You unlocked the <strong className="text-blue-600 dark:text-blue-400">{pendingBadgeAlerts[pendingBadgeAlerts.length - 1].label}</strong> badge!
                                    </p>
                                    
                                    {pendingBadgeAlerts[pendingBadgeAlerts.length - 1].msg && (
                                        <div className="mb-6 p-4 bg-blue-50 dark:bg-blue-900/20 rounded-xl text-sm text-blue-800 dark:text-blue-200 text-left italic">
                                            {pendingBadgeAlerts[pendingBadgeAlerts.length - 1].msg.split('\n').map((line, idx) => (
                                                <span key={idx}>{line}<br/></span>
                                            ))}
                                        </div>
                                    )}

                                    <button onClick={closeBadgeModal} className="w-full py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition shadow-sm">
                                        Awesome!
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* GLOBAL DIALOG */}
                        {dialog.isOpen && (
                            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 fade-in">
                                <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl scale-up border border-slate-200 dark:border-slate-700">
                                    <p className="text-lg font-semibold text-slate-800 dark:text-white mb-6 whitespace-pre-wrap">
                                        {dialog.message}
                                    </p>
                                    <div className="flex justify-end gap-3">
                                        {dialog.type === 'confirm' && (
                                            <button onClick={() => setDialog({ ...dialog, isOpen: false })} className="px-4 py-2 font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition">
                                                Cancel
                                            </button>
                                        )}
                                        <button onClick={() => { if (dialog.onConfirm) dialog.onConfirm(); setDialog({ ...dialog, isOpen: false }); }} className="px-4 py-2 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition shadow-sm">
                                            {dialog.type === 'confirm' ? 'Confirm' : 'OK'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
